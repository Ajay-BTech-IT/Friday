<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Jarvis</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#05080d; --panel:#0b1119; --line:#1a2634; --text:#dbe7f3; --muted:#7f93a8;
  --h:190; --glow:.45;
  --c:hsl(var(--h) 90% 66%);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr)}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:52% 48%}}
.app.focus{grid-template-columns:1fr;grid-template-rows:1fr}

/* ---------- stage ---------- */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 42%,#0a1420 0%,var(--bg) 70%)}
.grid{position:absolute;inset:0;opacity:.22;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(circle at 50% 42%,#000 0,transparent 70%)}
.aura{position:absolute;left:50%;top:42%;width:min(80vh,94%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,hsl(var(--h) 90% 55% / calc(var(--glow)*.5)) 0%,hsl(var(--h) 90% 45% / calc(var(--glow)*.16)) 45%,transparent 70%);
  pointer-events:none}
#face{position:relative;width:min(56vh,86%);max-height:62%;aspect-ratio:1;z-index:1}
#face svg{width:100%;height:100%;overflow:visible}
#avatar3d{position:absolute;inset:0;width:100%;height:100%;display:none;z-index:1;pointer-events:none}
.has3d #avatar3d{display:block}
.has3d #head{display:none}            /* the drawn face gives way to the 3D head; the rings and the glow stay */
.ringL{position:absolute;inset:0;will-change:transform;pointer-events:none}
.ringL svg{width:100%;height:100%;overflow:visible}
.ringL circle{fill:none;stroke:var(--c)}
.a1{animation:spin 46s linear infinite;opacity:.5}.a1 circle{stroke-width:1.2;stroke-dasharray:3 9}
.a2{animation:spin 30s linear infinite reverse;opacity:.3}.a2 circle{stroke-width:2;stroke-dasharray:90 40 12 40}
.a3{animation:spin 70s linear infinite;opacity:.45}.a3 circle{stroke-width:1;stroke-dasharray:1 7}
@keyframes spin{to{transform:rotate(360deg)}}
.stage[data-state=thinking] .a1{animation-duration:9s}.stage[data-state=thinking] .a2{animation-duration:6s}
.stage[data-state=listening] .a3{opacity:.9}.stage[data-state=listening] .a3 circle{stroke-width:2.4}
@media (prefers-reduced-motion:reduce){.ringL{animation:none}}
.halo{stroke:var(--c);stroke-opacity:.11;stroke-width:7;stroke-linejoin:round;paint-order:stroke}   /* a glow with no filter: a wide faint outline under the shape */

.caption{position:relative;z-index:1;margin-top:6px;text-align:center;min-height:42px}
.who{font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--c)}
.mood{margin-top:5px;font-size:13px;color:var(--muted);min-height:18px;font-style:italic}
.status{display:inline-block;width:7px;height:7px;border-radius:50%;background:#35c46a;margin-right:8px;vertical-align:middle}
.status.off{background:#c44}

.controls{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:10px;padding:0 12px}
.cb{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  background:#0c1520;color:var(--text);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.cb:hover:not(:disabled){border-color:var(--c);background:#122033}
.cb:disabled{opacity:.4;cursor:default}
.cb[aria-pressed=true]{border-color:var(--c);color:var(--c)}
.cb[aria-pressed=false] .on,.cb[aria-pressed=true] .off{display:none}
.cb.rec{background:#5a1620;border-color:#c33;color:#fff;animation:bl 1s steps(2) infinite}
.vol{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.vol input{width:84px;accent-color:hsl(var(--h) 90% 60%)}

#subtitle{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:4;width:min(760px,90%);text-align:center;font-size:19px;line-height:1.5;
  color:#fff;text-shadow:0 2px 12px #000,0 0 3px #000;display:none;pointer-events:none}
.focus #subtitle{display:block}

#emoji{position:absolute;right:12%;top:6%;font-size:clamp(34px,6vh,64px);opacity:0;z-index:3;pointer-events:none;
  font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
#emoji.pop{animation:pop 3.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(12px) scale(.4)}12%{opacity:1;transform:translateY(0) scale(1.15)}
  22%{transform:scale(1)}80%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-22px)}}

#player{position:absolute;right:14px;bottom:14px;width:min(420px,60%);z-index:5;display:none;
  background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px #000a}
#player.on{display:block}
#player .bar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:var(--panel);font-size:12px;color:var(--muted)}
#player .bar b{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;color:var(--text);max-width:80%}
#player iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.x{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px}.x:hover{color:#fff}

/* ---------- conversation ---------- */
.convo{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
@media (max-width:860px){.convo{border-left:0;border-top:1px solid var(--line)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.08em}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.m.me{align-self:flex-end;background:#16314a;border-bottom-right-radius:4px}
.m.bot{align-self:flex-start;background:#111b27;border:1px solid var(--line);border-bottom-left-radius:4px}
.m.sys{align-self:center;font-size:12px;color:var(--muted);background:none;padding:2px}
.m.err{color:#ff8a8a}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;margin-left:3px;background:var(--c);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom))}
#in{flex:1;min-width:0;background:#0d1620;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;font-size:15px;outline:none}
#in:focus{border-color:var(--c)}
.send{width:44px;border:0;border-radius:12px;background:var(--c);color:#031018;font-size:18px;cursor:pointer;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.focus .convo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#05080dcc 40%);border:0;z-index:6}
.focus #log,.focus .top{display:none}
.focus .compose{max-width:680px;margin:0 auto;width:100%;border:0}

dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 12px;font-size:16px}dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
dialog input[type=password]{width:100%;background:#0d1620;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font:inherit}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
dialog button{border-radius:8px;border:1px solid var(--line);background:#0d1620;color:var(--text);padding:8px 14px;cursor:pointer;font:inherit}
dialog button.p{background:var(--c);color:#031018;border:0;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="stage" id="stage" data-state="idle">
    <div class="grid"></div><div class="aura" id="aura"></div>
    <div id="face">
      <div class="ringL a1"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="190"/></svg></div>
      <div class="ringL a2"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="178"/></svg></div>
      <div class="ringL a3"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="198"/></svg></div>
      <canvas id="avatar3d" aria-hidden="true"></canvas>
      <span id="emoji"></span>
      <svg viewBox="0 0 400 400" aria-label="Face">
        <defs>
          <radialGradient id="plate" cx="50%" cy="38%" r="68%"><stop offset="0" stop-color="#14263a"/><stop offset=".7" stop-color="#0a1522"/><stop offset="1" stop-color="#050b13"/></radialGradient>
          <radialGradient id="cheek" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color:hsl(var(--h) 85% 60%);stop-opacity:.34"/><stop offset="1" style="stop-color:hsl(var(--h) 85% 60%);stop-opacity:0"/></radialGradient>
          <radialGradient id="sclera" cx="50%" cy="45%" r="62%"><stop offset="0" stop-color="#e4f1f6"/><stop offset=".75" stop-color="#a9c4d0"/><stop offset="1" stop-color="#6f8d9c"/></radialGradient>
          <radialGradient id="iris" cx="50%" cy="50%" r="50%"><stop offset="0" style="stop-color:hsl(var(--h) 95% 78%)"/><stop offset=".45" style="stop-color:hsl(var(--h) 85% 52%)"/><stop offset=".85" style="stop-color:hsl(var(--h) 80% 26%)"/><stop offset="1" style="stop-color:hsl(var(--h) 70% 14%)"/></radialGradient>
          <linearGradient id="lidShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".62"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
          <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:hsl(var(--h) 85% 62%)"/><stop offset="1" style="stop-color:hsl(var(--h) 85% 40%)"/></linearGradient>
          <clipPath id="clipL"><path id="clipLp"/></clipPath>
          <clipPath id="clipR"><path id="clipRp"/></clipPath>
          <clipPath id="clipM"><path id="clipMp"/></clipPath>
        </defs>
        <g id="head">
          <g id="plateG">
            <ellipse cx="200" cy="200" rx="150" ry="162" fill="url(#plate)" stroke="var(--c)" stroke-opacity=".5" stroke-width="1.5"/>
            <path d="M82 226 Q96 330 200 360 Q304 330 318 226" fill="none" stroke="var(--c)" stroke-opacity=".16" stroke-width="2"/>
            <ellipse id="cheekL" cx="112" cy="238" rx="40" ry="30" fill="url(#cheek)" opacity="0"/>
            <ellipse id="cheekR" cx="288" cy="238" rx="40" ry="30" fill="url(#cheek)" opacity="0"/>
          </g>
          <g id="feat">
            <path id="nose" fill="none" stroke="var(--c)" stroke-opacity=".3" stroke-width="2.2" stroke-linecap="round"/>
            <g>
              <path id="browL" class="halo" fill="var(--c)" fill-opacity=".92"/><path id="browR" class="halo" fill="var(--c)" fill-opacity=".92"/>
            </g>
            <g id="eyes">
              <path id="eyeLbase" class="halo" fill="#030a10"/><path id="eyeRbase" class="halo" fill="#030a10"/>
              <g clip-path="url(#clipL)"><rect id="scL" fill="url(#sclera)"/><circle id="irL" r="17.5" fill="url(#iris)"/><circle id="irRingL" r="17.5" fill="none" stroke="#02080d" stroke-opacity=".7" stroke-width="2"/><circle id="puL" r="7" fill="#02070b"/><circle id="hiL" r="4" fill="#fff" fill-opacity=".9"/><circle id="hi2L" r="1.9" fill="#fff" fill-opacity=".6"/><rect id="shL" fill="url(#lidShade)"/></g>
              <g clip-path="url(#clipR)"><rect id="scR" fill="url(#sclera)"/><circle id="irR" r="17.5" fill="url(#iris)"/><circle id="irRingR" r="17.5" fill="none" stroke="#02080d" stroke-opacity=".7" stroke-width="2"/><circle id="puR" r="7" fill="#02070b"/><circle id="hiR" r="4" fill="#fff" fill-opacity=".9"/><circle id="hi2R" r="1.9" fill="#fff" fill-opacity=".6"/><rect id="shR" fill="url(#lidShade)"/></g>
              <path id="lidUL" fill="none" stroke="var(--c)" stroke-width="3" stroke-linecap="round"/><path id="lidUR" fill="none" stroke="var(--c)" stroke-width="3" stroke-linecap="round"/>
              <path id="lidLL" fill="none" stroke="var(--c)" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/><path id="lidLR" fill="none" stroke="var(--c)" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/>
              <path id="creaseL" fill="none" stroke="var(--c)" stroke-opacity=".35" stroke-width="1.8" stroke-linecap="round"/><path id="creaseR" fill="none" stroke="var(--c)" stroke-opacity=".35" stroke-width="1.8" stroke-linecap="round"/>
            </g>
            <g id="mouthG">
              <path id="mIn" fill="#020a10"/>
              <g clip-path="url(#clipM)"><rect id="teethU" fill="#dcecf2" fill-opacity=".92"/><rect id="teethL" fill="#cfe2ea" fill-opacity=".85"/><ellipse id="tongue" style="fill:hsl(var(--h) 55% 30%)"/></g>
              <path id="lipU" class="halo" fill="url(#lip)"/><path id="lipL" class="halo" fill="url(#lip)"/>
              <path id="lipHi" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <div class="caption">
      <div class="who"><span class="status" id="dot"></span><span id="who">Jarvis</span></div>
      <div class="mood" id="mood"></div>
    </div>
    <div class="controls" role="toolbar" aria-label="Voice controls">
      <button class="cb" id="voiceBtn" aria-pressed="true" title="Turn spoken replies on or off"><span class="on">&#128266; Voice on</span><span class="off">&#128263; Voice off</span></button>
      <button class="cb" id="stopBtn" title="Stop speaking (Esc)" disabled>&#9209; Stop</button>
      <button class="cb" id="mic" title="Click, speak, click again">&#127908; Speak</button>
      <button class="cb" id="hfBtn" aria-pressed="false" title="Listens by itself and answers when you pause (experimental)"><span class="on">&#127911; Hands-free on</span><span class="off">&#127911; Hands-free</span></button>
      <span class="vol" title="Volume">&#128265;<input type="range" id="vol" min="0" max="1" step="0.05" value="1" aria-label="Volume"></span>
      <button class="cb" id="focusBtn" aria-pressed="false" title="Face only, with subtitles"><span class="on">&#128172; Show chat</span><span class="off">&#128065; Focus</span></button>
      <button class="cb" id="fsBtn" title="Fullscreen">&#9974; Fullscreen</button>
      <button class="cb" id="setBtn" title="Settings">&#9881; Settings</button>
    </div>
    <div id="subtitle"></div>
    <div id="player"><div class="bar"><b id="ptitle">Playing</b><button class="x" id="pclose" title="Close">&#10005;</button></div><iframe id="pframe" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
  </section>

  <section class="convo">
    <div class="top"><h1>CONVERSATION</h1></div>
    <div id="log" aria-live="polite"></div>
    <form class="compose" id="form" autocomplete="off">
      <input id="in" placeholder="Talk to me..." enterkeyhint="send">
      <button class="send" id="send" title="Send">&#10148;</button>
    </form>
  </section>
</div>

<dialog id="dlg"><form method="dialog">
  <h2>Settings</h2>
  <div id="authnote" style="font-size:13px;color:#ff8a8a;display:none">The server wants its API token.</div>
  <label for="gain">Expression strength: <span id="gainv"></span>&times; (how far the face moves; Jarvis still decides what it shows)</label>
  <input type="range" id="gain" min="1" max="3.5" step="0.1" style="width:100%">
  <div id="looks" hidden>
  <label>Skin tone</label>
  <div id="skins" style="display:flex;gap:7px;flex-wrap:wrap;align-items:center"></div>
  <label for="hairc">Hair colour <input type="color" id="hairc" value="#2a1a10" style="vertical-align:middle;margin-left:6px;border:0;background:none;width:34px;height:24px"></label>
  <label for="eyec">Eye colour <input type="color" id="eyec" value="#6a4a2a" style="vertical-align:middle;margin-left:6px;border:0;background:none;width:34px;height:24px"></label>
  </div>
  <label for="tok">API token (API_AUTH_TOKEN in .env; leave empty if the server has none)</label>
  <input type="password" id="tok" autocomplete="off">
  <div class="row"><button value="cancel">Cancel</button><button class="p" value="ok">Save</button></div>
</form></dialog>

<script src="lipsync.js"></script>
<script>
"use strict";
/* ===================================================================================================
   The face is drawn from numbers. Jarvis (the model) chooses them for every reply (/chat/expression);
   this file has no emotion names and no emotion -> face rules. Built in: a neutral resting face, generic
   life (blinks, tiny eye jumps, breathing, springy motion) and the lip sync, which follows the real audio.
   =================================================================================================== */
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const BASE = qs.get("server") || "";
const store = { get: (k) => { try { return localStorage.getItem(k) } catch { return null } },
                set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* ---------- the face model: every value is a spring that chases its target ---------- */
const REST = { eye_open: .82, lid_droop: 0, eye_smile: 0, pupil_size: 1, brow_raise: 0, brow_asym: 0, brow_tilt: 0, mouth_curve: .12,
               mouth_open: 0, mouth_width: .5, mouth_skew: 0, lip_press: 0, mouth_round: 0, head_tilt: 0, head_nod: 0, head_turn: 0,
               gaze_x: 0, gaze_y: 0, hue: 190, glow: .45, blink_rate: 1 };
const RANGE = { eye_open: [0, 1], lid_droop: [0, 1], eye_smile: [0, 1], pupil_size: [.6, 1.5], brow_raise: [-1, 1], brow_asym: [-1, 1], brow_tilt: [-1, 1],
                mouth_curve: [-1, 1], mouth_open: [0, 1], mouth_width: [0, 1], mouth_skew: [-1, 1], lip_press: [0, 1], mouth_round: [0, 1],
                head_tilt: [-15, 15], head_nod: [-1, 1], head_turn: [-1, 1], gaze_x: [-1, 1], gaze_y: [-1, 1], glow: [0, 1], blink_rate: [.3, 3] };
const STIFF = { eye_open: 24, lid_droop: 20, eye_smile: 18, pupil_size: 12, brow_raise: 15, brow_asym: 15, brow_tilt: 15, mouth_curve: 14,
                mouth_open: 20, mouth_width: 14, mouth_skew: 14, lip_press: 16, mouth_round: 14, head_tilt: 6.5, head_nod: 7, head_turn: 6,
                gaze_x: 34, gaze_y: 34, glow: 5, blink_rate: 4 };
const KEYS = Object.keys(REST).filter((k) => k !== "hue");
const S = Object.fromEntries(Object.keys(REST).map((k) => [k, { x: REST[k], v: 0, t: REST[k] }]));
const OFF = {};                       // generic live offsets (eye jumps, speech nods ...) added to the targets
let gain = parseFloat(store.get("gain") || "2"), holdUntil = 0, state = "idle";

let beatTimers = [];
function setTargets(f, scale) {
  for (const k of Object.keys(REST)) if (typeof f[k] === "number") {
    const r = RANGE[k]; S[k].t = r ? clamp(REST[k] + (f[k] - REST[k]) * scale, r[0], r[1]) : f[k];
  }
}
/* f = {beats:[{at, ...}], mood, emoji, hold} from Jarvis (or one flat face). The beats play out over the speech, like a person's face. */
function applyFace(f, scale = gain) {
  beatTimers.forEach(clearTimeout); beatTimers = [];
  const hold = (typeof f.hold === "number" ? f.hold : 5) * 1000;
  const beats = Array.isArray(f.beats) && f.beats.length ? f.beats : [f];
  const dur = Math.max(1500, replyWords / 2.7 * 1000), elapsed = speechStart ? performance.now() - speechStart : 0;
  beats.forEach((b, i) => {
    const last = i === beats.length - 1;
    const go = () => { setTargets(b, scale); holdUntil = performance.now() + (last ? hold : 9000); };
    const wait = i === 0 ? 0 : Math.max(0, (b.at || 0) * dur - elapsed);
    if (wait <= 30) go(); else beatTimers.push(setTimeout(go, wait));
  });
  if (f.mood !== undefined) $("mood").textContent = f.mood || "";
  if (f.emoji) { const e = $("emoji"); e.textContent = f.emoji; e.classList.remove("pop"); void e.offsetWidth; e.classList.add("pop"); }
}
const hueStep = (a, b, t) => { const d = ((b - a + 540) % 360) - 180; return (a + d * t + 360) % 360; };

/* ---------- geometry ---------- */
const $$ = (ids) => Object.fromEntries(ids.split(" ").map((i) => [i, $(i)]));
const E = $$("clipLp clipRp clipMp eyeLbase eyeRbase scL scR irL irR irRingL irRingR puL puR hiL hiR hi2L hi2R shL shR lidUL lidUR lidLL lidLR creaseL creaseR browL browR nose mIn teethU teethL tongue lipU lipL lipHi head plateG feat cheekL cheekR");
const set = (el, a, v) => { const x = typeof v === "number" ? Math.round(v * 100) / 100 : v, k = "_" + a; if (el[k] !== x) { el[k] = x; el.setAttribute(a, x); } };
const qctl = (apex, yl, yr) => 2 * apex - (yl + yr) / 2;      // control height that makes a quadratic curve peak at `apex`

function eyeGeometry(side, cx, cy, rx, apTop, apBot, lift) {
  // corners: outer corner a little higher, inner corner a touch lower

  if (hf.stream) hf.stream.getTracks().forEach((t) => t.stop());
  hf.on = false; hf.stream = null; hf.rec = null; $("hfBtn").setAttribute("aria-pressed", "false");
}
$("hfBtn").onclick = () => (hf.on ? hfStop() : hfStart());

/* ---------- controls ---------- */
const setVoice = (v) => { voiceOn = v; store.set("voice", v ? "1" : "0"); $("voiceBtn").setAttribute("aria-pressed", v); if (!v) stopAudio(); else audio(); };
$("voiceBtn").onclick = () => setVoice(!voiceOn); $("voiceBtn").setAttribute("aria-pressed", voiceOn);
$("stopBtn").onclick = stopSpeaking;
$("vol").value = volume; $("vol").oninput = () => { volume = parseFloat($("vol").value); store.set("vol", String(volume)); if (gainNode) gainNode.gain.value = volume; };
$("focusBtn").onclick = () => { const f = $("app").classList.toggle("focus"); $("focusBtn").setAttribute("aria-pressed", String(f)); store.set("focus", f ? "1" : "0"); };
if (store.get("focus") === "1") { $("app").classList.add("focus"); $("focusBtn").setAttribute("aria-pressed", "true"); } else $("focusBtn").setAttribute("aria-pressed", "false");
$("fsBtn").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (playing || busy)) stopSpeaking(); });

function openSettings(auth) {
  $("authnote").style.display = auth ? "block" : "none"; $("tok").value = token;
  $("gain").value = gain; $("gainv").textContent = gain.toFixed(1); $("dlg").showModal();
}
$("gain").oninput = () => { $("gainv").textContent = parseFloat($("gain").value).toFixed(1); };
$("setBtn").onclick = () => openSettings(false);
$("dlg").addEventListener("close", () => {
  if ($("dlg").returnValue === "ok") { token = $("tok").value.trim(); store.set("token", token); gain = parseFloat($("gain").value); store.set("gain", String(gain)); boot(); }
});

async function boot() {
  try {
    const p = await fetch(BASE + "/personas", { headers: headers() });
    if (p.status === 401) { setOnline(false); openSettings(true); return; }
    if (p.ok) { $("who").textContent = (await p.json()).active; setOnline(true); }
    const h = await fetch(BASE + "/chat/history?limit=12", { headers: headers() });
    if (h.ok) { log.innerHTML = ""; for (const m of await h.json()) bubble(m.role === "user" ? "me" : "bot", m.content); }
  } catch { setOnline(false); bubble("sys err", "Server not reachable. Start it with start_server.bat."); }
}

/* test hooks: ?face={...} sets a face by hand; ?ls={"open":.7,...} freezes the mouth movement of speech */
try { const f = qs.get("face"); if (f) { const o = JSON.parse(f); applyFace({ hold: 3600, ...o }, 1); for (const k of Object.keys(RANGE)) if (typeof o[k] === "number") S[k].x = S[k].t; if (typeof o.hue === "number") S.hue.x = o.hue; } } catch {}
try { const l = qs.get("ls"); if (l) { const o = JSON.parse(l); const hold = () => Object.assign(ls, o); setInterval(hold, 16); lip.step = () => ls; Object.assign(ls, o); playing = true; analyser = { getFloatFrequencyData() {}, fftSize: 1024 }; ctx = { sampleRate: 24000 }; } } catch {}
/* ---------- the 3D head (falls back to the drawn face when WebGL or the model is unavailable) ---------- */
let avatar = null;
const SKINS = ["#f1c9b0", "#e3b394", "#d8a88c", "#c68863", "#a86f4a", "#8a5638", "#6b3f27", "#4a2b1a"];
const look = { skin: store.get("skin") || SKINS[2], hair: store.get("hair") || "#2a1a10", eye: store.get("eye") || "#6a4a2a" };
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => clamp(Math.round(v * k), 0, 255)); return "#" + c.map((v) => v.toString(16).padStart(2, "0")).join(""); };
function applyLook() { if (!avatar) return; avatar.setSkin(look.skin); avatar.setHair(shade(look.hair, .45), look.hair); avatar.setEye(look.eye); }
if (qs.get("3d") === "1") {
  import("./avatar3d.js").then((m) => m.createAvatar($("avatar3d"), { skin: look.skin, eye: look.eye, hairRoot: shade(look.hair, .45), hairTip: look.hair }))
    .then((a) => { avatar = a; $("face").classList.add("has3d"); $("looks").hidden = false; applyLook(); })
    .catch((e) => console.warn("3D head unavailable, using the drawn face:", e && e.message || e));
}
$("skins").innerHTML = SKINS.map((c) => `<button type="button" class="sw" data-c="${c}" title="${c}" style="width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:${c};cursor:pointer;padding:0"></button>`).join("");
$("skins").onclick = (e) => { const b = e.target.closest(".sw"); if (!b) return; look.skin = b.dataset.c; store.set("skin", look.skin); applyLook(); markSkin(); };
const markSkin = () => document.querySelectorAll("#skins .sw").forEach((b) => (b.style.borderColor = b.dataset.c === look.skin ? "#fff" : "transparent"));
$("hairc").value = look.hair; $("eyec").value = look.eye; markSkin();
$("hairc").oninput = () => { look.hair = $("hairc").value; store.set("hair", look.hair); applyLook(); };
$("eyec").oninput = () => { look.eye = $("eyec").value; store.set("eye", look.eye); applyLook(); };

requestAnimationFrame(frame);
if (!qs.get("face") && !qs.get("ls")) boot();
</script>
</body>
</html>
